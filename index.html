<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#c48f50" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="냥이 수비대 (Meow Guard) — 뽑고, 합치고, 집을 지켜라! 고양이 합성 디펜스." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
    <title>냥이 수비대 — Meow Guard</title>
    <style>
      @font-face {
        font-family: 'GameLatin';
        src: url('./fonts/game-latin.acfffdc6.woff2') format('woff2');
        font-display: block;
      }
      @font-face {
        font-family: 'GameKR';
        src: url('./fonts/game-kr.d4758f6c.woff2') format('woff2');
        font-display: block;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #c48f50;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: none;
        font-family: 'GameLatin', 'GameKR', system-ui, sans-serif;
      }
      #stage {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #stage canvas {
        display: block;
      }
      /*
       * Wider than 9:16 the portrait canvas is pillarboxed, and the page around it becomes the floor it lies on:
       * planks 172 px tall like the kit's drawFloor (wood #c48f50, woodDark #a06a33, woodLight #e0b070), staggered
       * end joints, a soft vignette, and a flat stepped shadow under the sheet. Below that ratio the canvas fills
       * the screen, so none of this is declared and a phone paints only the flat colour.
       */
      @media (min-aspect-ratio: 9/16) {
        body {
          background:
            repeating-linear-gradient(180deg, rgba(160, 106, 51, 0.5) 0 4px, rgba(224, 176, 112, 0.28) 4px 7px, rgba(224, 176, 112, 0) 7px 172px),
            repeating-linear-gradient(180deg, rgba(224, 176, 112, 0.11) 0 172px, rgba(160, 106, 51, 0.09) 172px 344px), #c48f50;
        }
        /*
         * End joints, one set per plank row (even / odd) at different spacings so the rows do not line up. Both
         * come before #stage in paint order (html::before, body::before), so the canvas covers them.
         */
        html::before,
        body::before {
          content: '';
          position: fixed;
          inset: 0;
          pointer-events: none;
        }
        html::before {
          background: repeating-linear-gradient(90deg, rgba(160, 106, 51, 0) 0 150px, rgba(160, 106, 51, 0.5) 150px 153px, rgba(160, 106, 51, 0) 153px 620px);
          -webkit-mask-image: repeating-linear-gradient(180deg, transparent 0 4px, #000 4px 172px, transparent 172px 344px);
          mask-image: repeating-linear-gradient(180deg, transparent 0 4px, #000 4px 172px, transparent 172px 344px);
        }
        body::before {
          background: repeating-linear-gradient(90deg, rgba(160, 106, 51, 0) 0 360px, rgba(160, 106, 51, 0.5) 360px 363px, rgba(160, 106, 51, 0) 363px 780px);
          -webkit-mask-image: repeating-linear-gradient(180deg, transparent 0 176px, #000 176px 344px);
          mask-image: repeating-linear-gradient(180deg, transparent 0 176px, #000 176px 344px);
        }
        /* Inside #stage and behind the canvas: only the pillars show it. */
        #stage::before {
          content: '';
          position: absolute;
          inset: 0;
          z-index: -1;
          background: radial-gradient(ellipse at center, rgba(74, 50, 34, 0) 40%, rgba(74, 50, 34, 0.46) 100%);
        }
        #stage canvas {
          box-shadow:
            0 0 0 5px rgba(74, 50, 34, 0.2),
            0 0 0 14px rgba(74, 50, 34, 0.08),
            12px 8px 0 14px rgba(74, 50, 34, 0.07);
        }
      }
      /* Instant splash: pure CSS so something friendly is on screen before any JS runs. */
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #4a3222;
        transition: opacity 0.35s ease;
        pointer-events: none;
        z-index: 5;
      }
      #boot.hide {
        opacity: 0;
      }
      /* A cream paper card with a flat shadow, held down by a strip of washi tape. */
      #boot .sheet {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 22px;
        width: 280px;
        padding: 44px 30px 30px;
        background: #fbf3e2;
        border-radius: 30px 36px 28px 34px / 34px 28px 36px 30px;
        box-shadow:
          inset 0 0 0 2px rgba(180, 143, 98, 0.35),
          0 6px 0 rgba(106, 69, 39, 0.22);
      }
      #boot .sheet::before {
        content: '';
        position: absolute;
        top: -14px;
        left: 50%;
        width: 96px;
        height: 30px;
        margin-left: -48px;
        transform: rotate(-3deg);
        background:
          repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.4) 0 7px, rgba(255, 255, 255, 0) 7px 14px),
          repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.4) 0 7px, rgba(255, 255, 255, 0) 7px 14px), rgba(243, 169, 186, 0.9);
        clip-path: polygon(0 0, 100% 0, 97% 25%, 100% 50%, 97% 75%, 100% 100%, 0 100%, 3% 75%, 0 50%, 3% 25%);
      }
      #boot .paw {
        width: 92px;
        height: 92px;
        animation: bootBounce 0.9s cubic-bezier(0.3, 0.6, 0.4, 1) infinite alternate;
        filter: drop-shadow(0 6px 0 rgba(106, 69, 39, 0.25));
      }
      #boot .bar {
        width: 220px;
        height: 18px;
        border-radius: 999px;
        background: #d3bb94;
        overflow: hidden;
        box-shadow:
          inset 0 0 0 2px rgba(180, 143, 98, 0.7),
          0 3px 0 rgba(106, 69, 39, 0.2);
      }
      #boot .bar > i {
        display: block;
        height: 100%;
        width: 0%;
        /* A painted fill: flat coral with an uneven leading edge. */
        border-radius: 999px 7px 9px 999px / 999px 10px 6px 999px;
        background: #f0796b;
        transition: width 0.2s ease;
      }
      #boot .msg {
        font-size: 18px;
        letter-spacing: 0.5px;
        color: #4a3222;
        opacity: 0.85;
      }
      @keyframes bootBounce {
        from {
          transform: translateY(0) scale(1.04, 0.96);
        }
        to {
          transform: translateY(-22px) scale(0.97, 1.03);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .paw {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="boot">
      <div class="sheet">
        <svg class="paw" viewBox="0 0 100 100" aria-hidden="true">
          <g fill="#f0bc43" stroke="#4a3222" stroke-width="5" stroke-linejoin="round">
            <ellipse cx="50" cy="66" rx="24" ry="20" />
            <ellipse cx="20" cy="42" rx="10" ry="13" />
            <ellipse cx="40" cy="24" rx="10" ry="13" />
            <ellipse cx="62" cy="24" rx="10" ry="13" />
            <ellipse cx="81" cy="42" rx="10" ry="13" />
          </g>
        </svg>
        <div class="bar"><i id="boot-bar"></i></div>
        <div class="msg" id="boot-msg">Loading…</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
