<!doctype html>
<meta charset="utf-8">
<title>probe</title>
<script type="module">
const out = {};
const post = (o) => fetch('/event', { method: 'POST', body: JSON.stringify(o) });
try {
  out.ua = navigator.userAgent;
  out.hasVE = typeof VideoEncoder, out.hasAE = typeof AudioEncoder;
  const v = {};
  for (const codec of ['avc1.640028', 'avc1.4d0028', 'avc1.42001f', 'vp09.00.40.08', 'av01.0.08M.08']) {
    for (const hw of ['no-preference', 'prefer-software', 'prefer-hardware']) {
      try {
        const r = await VideoEncoder.isConfigSupported({ codec, width: 1920, height: 1080, bitrate: 8e6, framerate: 30, hardwareAcceleration: hw, ...(codec.startsWith('avc') ? { avc: { format: 'avc' } } : {}) });
        v[codec + '/' + hw] = r.supported;
      } catch (e) { v[codec + '/' + hw] = 'err ' + e.message; }
    }
  }
  out.video = v;
  const a = {};
  for (const codec of ['mp4a.40.2', 'opus', 'flac']) {
    try {
      const r = await AudioEncoder.isConfigSupported({ codec, sampleRate: 48000, numberOfChannels: 2, bitrate: 192000 });
      a[codec] = r.supported;
    } catch (e) { a[codec] = 'err ' + e.message; }
  }
  out.audio = a;
  const f = new FontFace('Jua', 'url(/fonts/Jua.ttf)');
  await f.load();
  out.fontLoaded = f.status;
  const c = document.createElement('canvas'); c.width = 64; c.height = 64;
  const g = c.getContext('2d');
  const img = new Image(); img.src = '/img/unit_w_paw.webp'; await img.decode();
  out.img = [img.naturalWidth, img.naturalHeight];
  out.dpr = devicePixelRatio;
  out.audioCtx = typeof OfflineAudioContext;
} catch (e) { out.error = String(e && e.stack || e); }
await post(out);
await fetch('/finish', { method: 'POST' });
</script>
